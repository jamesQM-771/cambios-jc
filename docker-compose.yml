# Referencia para producción (D14). En desarrollo se usa PostgreSQL 18 nativo.
# La API y la web se agregan a este archivo en la fase 14 (empaquetado).
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: cambios_jc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: cambios_jc
      TZ: UTC
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - datos_postgres:/var/lib/postgresql

volumes:
  datos_postgres:
