name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cambios_jc
          POSTGRES_PASSWORD: clave_solo_para_ci
          POSTGRES_DB: cambios_jc_pruebas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cambios_jc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Prisma exige DATABASE_URL incluso para generar el cliente; en CI es la misma base desechable.
      DATABASE_URL: postgresql://cambios_jc:clave_solo_para_ci@localhost:5432/cambios_jc_pruebas
      DATABASE_URL_PRUEBAS: postgresql://cambios_jc:clave_solo_para_ci@localhost:5432/cambios_jc_pruebas

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Los umbrales viven en vitest.config.ts: si la cobertura baja de ellos, este paso falla.
      - name: Pruebas con cobertura
        run: npm run test:cobertura

      - name: Publicar reporte de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: coverage/
          retention-days: 14

      - name: Build
        run: npm run build
